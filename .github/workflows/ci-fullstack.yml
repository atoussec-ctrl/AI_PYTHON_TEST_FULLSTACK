name: Full-stack CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-fullstack.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-fullstack.yml"

jobs:
  smoke:
    name: Browser + Vite + Flask smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ./backend

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real full-stack smoke
        working-directory: frontend
        run: pnpm test:e2e:fullstack
        env:
          CI: "true"
          PLAYWRIGHT_BACKEND_PYTHON: python

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-playwright-report
          path: frontend/playwright-report/
          retention-days: 7
